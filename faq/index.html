<!DOCTYPE html>
<html lang="ja">

<head>
    <!-- メタ情報 -->
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <meta name="description" content="Kirameki Farmは革新的な農業機器とビッグデータ、自動運転のロボット、リジェネラティブ農業を駆使して持続可能な農業を目指すイノベーション企業です。次世代の子どもたちに環境に優しい未来農業を残すために、効率化と環境配慮を融合した活動を推進しています。" >
    <title>持続可能な未来農業を実現 | Kirameki Farm</title>

    <!-- OGP設定 -->
    <meta property="og:title" content="持続可能な未来農業を実現 | Kirameki Farm" >
    <meta property="og:description" content="Kirameki Farmは革新的な農業機器とビッグデータ、自動運転のロボット、リジェネラティブ農業を駆使して持続可能な農業を目指すイノベーション企業です。次世代の子どもたちに環境に優しい未来農業を残すために、効率化と環境配慮を融合した活動を推進しています。" >
    <meta property="og:type" content="article" >
    <meta property="og:url" content="https://example.com/price/">
    <meta property="og:site_name" content="Kirameki Farm" >

    <!-- リセットCSS -->
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css" >
    <!-- CSS -->
    <link rel="stylesheet" href="/assets/style/main.css" >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">

    <!-- JS関連 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/assets/script/main.js"></script>
</head>


<body>
    <main>
        <!-- ヘッダー -->
        <header class="header">
            <div class="header__container">
                <div class="header__content">
                    <h1 class="header__title">
                        <a class="header__link" href="/">
                            <img class="header__logo" src="/assets/image/common/header_logo.svg" alt="Kirameki Farm">
                        </a>
                    </h1>
                    <!-- PCメニュー -->
                    <nav class="header__pc-nav">
                        <ul class="header__pc-ul">
                            <li><a class="header__pc-link header__pc-link--first" href="/price">価格・スペック</a></li>
                            <li><a class="header__pc-link header__pc-link--second" href="/faq">よくあるご質問</a></li>
                        </ul>
                    </nav>
                    <div class="header__hamburger">
                        <span class="header__line"></span>
                        <span class="header__line"></span>
                        <span class="header__line header__line--third"></span>
                    </div>
                </div>
                <!-- スマホメニュー -->
                <nav class="header__sp-nav">
                    <ul class="header__sp-ul">
                        <li class="header__sp-list header__sp-list--first">
                            <a class="header__sp-link" href="/">
                                トップ
                            </a>
                        </li>
                        <li class="header__sp-list">
                            <a class="header__sp-link" href="/price">
                                価格・スペック
                            </a>
                        </li>
                        <li class="header__sp-list">
                            <a class="header__sp-link" href="/faq">
                                よくあるご質問
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </header>


        <section class="faq-cover">
            <div class="faq-cover__container">
                <picture>
                    <source media="(min-width: 768px)" srcset="/assets/image/faq/cover_pc.jpg" >
                    <img class="faq-cover__image" src="/assets/image/faq/cover_sp.jpg">
                </picture>
                <h1 class="faq-cover__title">よくあるご質問</h1>
                <nav class="faq-cover__breadcrumb">
                    <ol class="faq-cover__ol">
                        <li class="faq-cover__list">
                            <a class="faq-cover__link" href="/">トップ</a>
                        </li>
                        <li class="faq-cover__list faq-cover__list--arrow"></li>
                        <li class="faq-cover__list faq-cover__list--highlight">
                            <span>よくあるご質問</span>
                        </li>
                    </ol>
                </nav>
            </div>
        </section>

        <!-- FAQ -->
        <div class="faq">
            <div class="faq__container">
                <div class="faq__accordion">
                    <div class="faq__accordion-trigger" role="button" tabindex="0" aria-expanded="false">
                        <span class="faq__text-q faq__text">Q.</span>
                        <div class="faq__item">
                            <span class="faq__category">ご利用について</span>
                            <span class="faq__question faq__text">農業用ドローンの主な用途は何ですか？</span>
                        </div>
                        <img src="/assets/image/faq/faq_minus_sp.png" class="faq__accordion-icon" alt="">
                    </div>
                    <div class="faq__accordion-content">
                        <div class="faq__accordion-body">
                            <span class="faq__answer faq__text">
                                農業用ドローンは、作物の健康状態のモニタリング、除草剤・肥料等の散布、灌漑システムの管理など、農業生産の効率を向上させるために使用されます。
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <footer class="footer">
            <div class="footer__container">
                <nav class="footer__nav">
                    <ul class="footer__ul">
                        <li class="footer__list"><a class="footer__link footer__link--first" href="/price/">価格・スペック</a></li>
                        <li class="footer__list"><a class="footer__link footer__link--second" href="/faq/">よくあるご質問</a></li>
                    </ul>
                </nav>
            </div>
        </footer>
    </main>
</body>
</html>
